name: County Records Poll

on:
  workflow_dispatch:
  # Scheduled run paused — scrapers need to be updated before re-enabling
  # All three county portals have changed and now have bot protection:
  #   Broward:    officialrecords.broward.org/AcclaimWeb   (Cloudflare 403)
  #   Miami-Dade: onlineservices.miamidadeclerk.gov        (reCAPTCHA)
  #   Palm Beach: erec.mypalmbeachclerk.com                (Landmark Web, AJAX)
  # Next step: evaluate Playwright vs Apify to handle the new portals

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.0

      - uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run county records monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNTY_RECORDS_DATABASE_URL: ${{ secrets.COUNTY_RECORDS_DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python main.py

  investigate-on-failure:
    needs: [poll]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CI investigator
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh workflow run watcher.yml --repo abdirahman2ali/ci-investigator
